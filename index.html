<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boston Home Search" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="Boston Home Search. Streets within a Tuesday-morning drive, lighting up from any address."
    />
    <title>Boston Home Search</title>
  </head>
  <body>
    <div id="app" data-state="loading">
      <div id="map" role="region" aria-label="Map"></div>
      <header class="brand">
        <h1 class="eyebrow">Boston Home Search</h1>
        <form id="trip" autocomplete="off">
          <label class="place">
            <span class="sr">Starting address</span>
            <input id="place" name="place" placeholder="Starting address" enterkeyhint="search" maxlength="120" />
          </label>
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
          <div class="trip-row">
            <div class="stepper">
              <button type="button" id="min-down" aria-label="Fewer minutes">−</button>
              <label class="minutes">
                <span class="sr">Drive time in minutes</span>
                <input id="minutes" name="minutes" inputmode="numeric" min="5" max="30" step="1" value="15" />
                <span>min</span>
              </label>
              <button type="button" id="min-up" aria-label="More minutes">+</button>
            </div>
            <button type="submit" id="go">Go</button>
          </div>
        </form>
        <p class="sub" id="sub">Tuesday morning, about 8:00</p>
      </header>
      <section id="legend" class="legend" aria-label="Drive time legend"></section>
      <div id="listing-tools" class="listing-tools" hidden>
        <div class="listing-filter" role="group" aria-label="Listing type">
          <button type="button" data-kind="sale" aria-pressed="false">For sale</button>
          <button type="button" data-kind="rent" aria-pressed="false">For rent</button>
          <button type="button" data-kind="both" aria-pressed="true">Both</button>
        </div>
        <button type="button" id="listing-list-toggle" aria-expanded="false">List</button>
        <p class="listing-note">from Kendall School</p>
      </div>
      <section id="listing-sheet" class="listing-sheet" hidden aria-label="Listings by drive time">
        <header>
          <div>
            <h2>Listings</h2>
            <p>from Kendall School</p>
          </div>
          <button type="button" id="listing-sheet-close">Close</button>
        </header>
        <ul id="listing-rows"></ul>
      </section>
      <article id="listing-card" class="listing-card" hidden role="dialog" aria-labelledby="listing-card-price">
        <button type="button" id="listing-card-close" aria-label="Close listing">Close</button>
        <img id="listing-card-img" alt="" hidden />
        <div class="listing-card-body">
          <p id="listing-card-badge" class="listing-new" hidden>New</p>
          <h2 id="listing-card-price"></h2>
          <p id="listing-card-facts"></p>
          <p id="listing-card-address"></p>
          <p id="listing-card-drive"></p>
          <p id="listing-card-broker" hidden></p>
          <a id="listing-card-link" target="_blank" rel="noopener noreferrer">View listing</a>
        </div>
      </article>
      <p id="status" class="status" hidden><span id="status-text"></span></p>
      <button type="button" id="action" class="action" hidden>Skip</button>
      <div id="curtain" role="status">
        <div class="curtain-card">
          <p class="eyebrow">Boston Home Search</p>
          <h2>The morning drive</h2>
          <p id="curtain-status">Reading Tuesday morning traffic…</p>
          <div class="bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
      <div id="error" class="error" hidden>
        <div class="error-card">
          <h2>The map didn’t load</h2>
          <p id="error-text"></p>
          <button type="button" id="retry">Try again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
